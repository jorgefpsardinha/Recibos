# Evita que o projeto gratuito do Supabase entre em pausa por inatividade.
# Precisa dos segredos SUPABASE_URL e SUPABASE_KEY (Settings > Secrets and variables > Actions).
name: Manter Supabase ativo
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedido ao Supabase
        run: |
          curl -sS -X POST -w "\n%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
